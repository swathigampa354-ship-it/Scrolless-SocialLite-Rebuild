name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-android@v3
        with:
          api-level: '33'
          # The following installs the required SDK command-line tools and accepts licenses
          # ANDROID_SDK_ROOT is automatically set by this action

      - uses: gradle/wrapper-validation-action@v2

      - name: Accept Android SDK licenses
        run: |
          # Accept all SDK licenses silently
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - run: ./gradlew spotlessCheck
      - run: ./gradlew test
      - run: ./gradlew :app:lintDebug
      - run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
